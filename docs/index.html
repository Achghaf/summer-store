<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Summer Store - Boutique Estivale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // GitHub Pages SPA redirect — restore path stored by 404.html
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          var q = window.location.search.match(/[?&]q=([^&]*)/);
          window.history.replaceState(
            null,
            null,
            window.location.pathname +
              (p[1] ? decodeURIComponent(p[1].replace(/~and~/g, "&")) : "") +
              (q ? "?" + decodeURIComponent(q[1].replace(/~and~/g, "&")) : "") +
              window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
